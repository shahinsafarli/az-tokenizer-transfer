# 164-run grid, minus interactive-notebook packages the container shipped and
# the project never imports (those are listed at the bottom, and the untouched
# `pip freeze` is preserved as env_freeze_as_run.txt).
#
# Host: vast.ai instance, NVIDIA H100 NVL (95,830 MiB), driver 595.71.05,
#       CUDA 13.2 host / torch cu128 build, AMD EPYC 9V84 40 vCPU, 313 GiB RAM.
# Captured: 2026-09-09, immediately after the grid finished (164/164).
#
# Install with:
#   pip install -r requirements.lock \
#       --extra-index-url https://download.pytorch.org/whl/cu128
#
# The nvidia-*-cu12 wheels below are the separate CUDA runtime packages the
# Linux cu128 torch wheel pulls in; they are listed because they were present,
# not because the project imports them. Do NOT use --no-deps.
#
