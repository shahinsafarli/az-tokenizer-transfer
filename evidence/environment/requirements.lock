# pinned torch 2.4.1 / transformers 4.44.2 / numpy 1.26.4 and asserted that the
# stack must not be resolved fresh on the run host. That instruction could not
# be followed: the pre-run lock was unresolvable (fsspec==2026.7.0 conflicts
# with datasets==2.21.0, which requires fsspec[http]<=2024.6.1). The stack below
