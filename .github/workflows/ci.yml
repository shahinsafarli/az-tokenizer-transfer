name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope-hygiene:
    runs-on: ubuntu-24.04
    outputs:
      source_ready: ${{ steps.scope.outputs.source_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Compile Git hygiene code
        run: python -m py_compile .github/scripts/pr_hygiene.py
      - name: Test Git hygiene guards
        run: python .github/scripts/pr_hygiene.py --self-test
      - name: Verify registered contribution and readiness
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_hygiene.py

  source-tests:
    needs: scope-hygiene
    if: needs.scope-hygiene.outputs.source_ready == 'true'
    runs-on: ubuntu-24.04
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies after source import
        run: python -m pip install -r requirements-ci.txt
      - name: Run available source tests with no model or dataset downloads
        run: python -m pytest -q -m 'not slow'

  # Complete-grid, member-delivery and final-document gates become available
  # with their registered PRs. PR17 updates CI for final delivery readiness.
  # No training launcher, held-out evaluation, or PDF build runs in PR01.
